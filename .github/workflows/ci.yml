name: ClipBoost CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Install FFmpeg for real preview smoke
        run: choco install ffmpeg -y --no-progress

      - name: Test real FFmpeg blurred-crop preview
        run: node --test server/video/preview-ffmpeg.smoke.js
